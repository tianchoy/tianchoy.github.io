name: Deploy Hugo site to GitHub Pages

# 推送到 main 分支即自动构建并发布；也可在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个发布任务，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 部署完成后主动通知搜索引擎来抓取 sitemap，加快/扩大收录
      # （Google、Bing 的 ping 端点；百度需在搜索资源平台手动提交 sitemap.xml，
      #  因为百度没有公开的匿名 ping 接口）
      - name: Ping search engines with sitemap
        if: success()
        run: |
          SITEMAP="${{ steps.deployment.outputs.page_url }}sitemap.xml"
          echo "Sitemap: $SITEMAP"
          curl -s -A "Mozilla/5.0" -o /dev/null -w "google: %{http_code}\n" "https://www.google.com/ping?sitemap=$SITEMAP" || true
          curl -s -A "Mozilla/5.0" -o /dev/null -w "bing:   %{http_code}\n" "https://www.bing.com/ping?sitemap=$SITEMAP" || true
