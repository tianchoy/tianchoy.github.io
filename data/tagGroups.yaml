# 标签页分组（/tags/）
#
# 只影响「标签页怎么展示」，不影响标签本身：文章的 tags、/tags/<tag>/ 页面
# 都由 Hugo 的 taxonomy 生成。新增标签后记得往这里补一行，否则会落到页面
# 底部的「其他」分组里（不会丢，只是没归类）。
#
# 组的顺序 = 页面上从上到下的顺序；组内标签按文章数降序排。

