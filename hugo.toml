baseURL = "https://tianchoy.github.io/"
title = "特严赤傲"
theme = "keepit"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
enableEmoji = true
enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 30

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = true
    guessSyntax = true
    style = "github"

[pagination]
  pagerSize = 10

# 生成首页 JSON 搜索索引（KeepIt 的 lunr 搜索需要 /index.json）
[outputs]
  home = ["HTML", "JSON"]

[taxonomies]
  category = "categories"

[params]
  defaultTheme = "auto"
  # 给 CSS/JS 资源加内容哈希，避免 GitHub Pages CDN 缓存旧样式
  fingerprint = "sha256"
  dateFormat = "2006-01-02"
  title = "特严赤傲"
  description = "小田的github博客,这是一些关于学习积累、问题笔记、代码分享、生活随笔等等的记录。"
  keywords = "博客,前端,Vue,React,Flutter,生活随笔"

  # 站内搜索：KeepIt 的 lunr 方案，索引为构建产物 /index.json
  # 中文分词由 assets/lib/lunr/lunr.segmentit.js 覆盖主题的 3.7MB 词典实现
  [params.search]
    enable = true
    type = "lunr"
    # 每条记录（按 h2/h3 切片）保留的正文字符数
    contentLength = 4000
    placeholder = "搜索文章"
    maxResultLength = 10
    snippetLength = 40
    highlightTag = "em"
    absoluteURL = false

  [params.header]
    [params.header.title]
      name = "特严赤傲"

  [params.footer]
    enable = true
    hugo = true
    copyright = true
    author = true
    since = 2022
    custom = """
<div class="busuanzi-stats">
  <span id="busuanzi_container_site_pv">本站总访问量 <span id="busuanzi_value_site_pv">-</span> 次</span>
  <span class="busuanzi-sep">·</span>
  <span id="busuanzi_container_site_uv">访客数 <span id="busuanzi_value_site_uv">-</span> 人</span>
  <span class="busuanzi-sep">·</span>
  <span id="busuanzi_container_page_pv">本页阅读量 <span id="busuanzi_value_page_pv">-</span> 次</span>
</div>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
"""

  [params.section]
    paginate = 20
    dateFormat = "01-02"
    rss = 10

  [params.list]
    paginate = 20
    dateFormat = "01-02"
    rss = 10

  [params.app]
    svgFavicon = "images/favicon.svg"

  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      gravatarEmail = ""
      avatarURL = "/images/profile.jpg"
      title = "特严赤傲"
      subtitle = "热爱祖国、前端程序员、爱好摄影以及生活记录者。"
      typeit = false
      social = true
    [params.home.posts]
      enable = false
      paginate = 6

  [params.social]
