baseURL = "https://tianchoy.github.io/"
title = "特严赤傲"
theme = "keepit"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
enableEmoji = true
enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 30

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = true
    guessSyntax = true
    style = "github"

[pagination]
  pagerSize = 10

[taxonomies]
  category = "categories"

[params]
  defaultTheme = "auto"
  dateFormat = "2006-01-02"
  title = "特严赤傲"
  description = "小田的github博客,这是一些关于学习积累、问题笔记、代码分享、生活随笔等等的记录。"
  keywords = "博客,前端,Vue,React,Flutter,生活随笔"

  [params.header]
    [params.header.title]
      name = "特严赤傲"

  [params.footer]
    enable = true
    hugo = true
    copyright = true
    author = true
    since = 2022

  [params.section]
    paginate = 20
    dateFormat = "01-02"
    rss = 10

  [params.list]
    paginate = 20
    dateFormat = "01-02"
    rss = 10

  [params.app]
    svgFavicon = "images/favicon.svg"

  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      gravatarEmail = ""
      avatarURL = "images/profile.jpg"
      title = "特严赤傲"
      subtitle = "乙火"
      typeit = false
      social = true
    [params.home.posts]
      enable = false
      paginate = 6

  [params.social]
    GitHub = "tianchoy"
    Fanfou = "tianchoy"
