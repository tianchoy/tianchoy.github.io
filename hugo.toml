baseURL = "https://tianchoy.github.io/"
title = "特严赤傲"
theme = "keepit"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
enableEmoji = true
enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 30

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = true
    guessSyntax = true
    style = "github"

[pagination]
  pagerSize = 10

# 生成首页 JSON 搜索索引（KeepIt 的 lunr 搜索需要 /index.json）
[outputs]
  home = ["HTML", "JSON"]

[taxonomies]
  category = "categories"
  # 必须显式声明：只写 category 会把 Hugo 默认的 tags 一起顶掉，
  # 导致文章底部 /tags/<tag>/ 页面不存在、GetPage 取到 nil，标签渲染成空。
  tag = "tags"

[params]
  defaultTheme = "auto"
  # 给 CSS/JS 资源加内容哈希，避免 GitHub Pages CDN 缓存旧样式
  fingerprint = "sha256"
  dateFormat = "2006-01-02"
  title = "特严赤傲"
  description = "小田的博客,这是一些关于学习积累、问题笔记、代码分享、生活随笔等的记录。"
  # 站点级关键词：首页/列表页用。文章页自动改用该文的 tags。
  # 2026-10-29 调整：原 Vue/React/Flutter 已无对应文章，换成贴合「随笔」内容的词。
  keywords = ["随笔", "生活", "散文", "青春", "人生", "回忆", "自我", "博客", "记录", "思考", "前端", "摄影"]

  # 站内搜索：KeepIt 的 lunr 方案，索引为构建产物 /index.json
  # 中文分词由 assets/lib/lunr/lunr.segmentit.js 覆盖主题的 3.7MB 词典实现
  [params.search]
    enable = true
    type = "lunr"
    # 每条记录（按 h2/h3 切片）保留的正文字符数
    contentLength = 4000
    placeholder = "搜索文章"
    maxResultLength = 10
    snippetLength = 40
    highlightTag = "em"
    absoluteURL = false

  [params.header]
    [params.header.title]
      name = "特严赤傲"

  # 访问统计：provider 可选 none / goatcounter / umami / ga4 / cloudflare / busuanzi
  # 页脚数字由 layouts/partials/stats.html 按这里的分支注入；none 时不输出任何脚本
  # 不蒜子（busuanzi）仅作兜底：同一域名会返回数量级不同的数据，不建议再用
  [params.analytics]
    provider = "goatcounter"
    [params.analytics.goatcounter]
      # 只填子域名（后台地址是 https://tianchao.goatcounter.com，这里就写 tianchao）
      site = "tianchao"
      # 页脚显示「本站浏览 / 本页阅读量」，需要后台勾选 Allow adding visitor counts on your website
      counters = true
    [params.analytics.umami]
      script = "https://cloud.umami.is/script.js"
      websiteId = ""
    [params.analytics.ga4]
      measurementId = ""
    [params.analytics.cloudflare]
      token = ""

  [params.footer]
    enable = true
    hugo = true
    copyright = true
    author = true
    since = 2022

  [params.section]
    paginate = 20
    dateFormat = "01-02"
    rss = 10

  [params.list]
    paginate = 20
    dateFormat = "01-02"
    rss = 10

  [params.app]
    svgFavicon = "images/favicon.svg"

  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      gravatarEmail = ""
      avatarURL = "/images/profile.jpg"
      title = "特严赤傲"
      subtitle = "热爱祖国、前端程序员、爱好摄影以及生活记录者。"
      typeit = false
      social = true
    [params.home.posts]
      enable = false
      paginate = 6

  [params.social]
    GitHub = "tianchoy"
    Fanfou = "tianchoy"
    Linkedin = ""
    Twitter = ""
    Instagram = ""
    Facebook = ""
