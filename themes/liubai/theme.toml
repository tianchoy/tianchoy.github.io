# theme.toml for a Hugo theme

name = "LiuBai"
license = "MIT"
licenselink = "https://opensource.org/licenses/MIT"
description = "A clean, elegant, and minimal Hugo theme, inspired by the Chinese aesthetic of 留白 (negative space / whitespace)."
homepage = "https://tianchoy.github.io/"
demosite = "https://tianchoy.github.io/"

tags = [
  "blog",
  "clean",
  "minimal",
  "responsive",
  "dark",
  "theme"
]
features = [
  "clean-design",
  "favicon",
  "multilingual",
  "pagination",
  "social-menu",
  "syntax-highlighting",
  "SEO Optimized",
  "dark-mode"
]

min_version = "0.62.0"

[author]
  name = "tianchoy"
  homepage = "https://tianchoy.github.io/"
