<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写文章 · 写作台</title>
<link rel="stylesheet" href="/ui/ui.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/publish">
      <span class="brand-mark">写</span>
      <span class="brand-text">写作台<em>特严赤傲</em></span>
    </a>
    <nav class="nav">
      <a class="nav-link" data-page="publish" href="/publish">写文章</a>
      <a class="nav-link" data-page="manage" href="/manage">文章管理</a>
      <a class="nav-link" data-page="about" href="/edit/about">关于页</a>
      <a class="nav-link" data-page="admin" href="/admin">站点设置</a>
      <a class="nav-link" href="/" target="_blank">预览站点 ↗</a>
    </nav>
    <div class="topbar-right">
      <span class="status-chip">本地服务运行中</span>
      <button class="btn btn-ghost btn-sm" id="btnShutdown">关闭服务</button>
    </div>
  </div>
</header>

<main class="workspace">
  <section class="pane editor">
    <div class="pane-head">
      <div class="edit-banner" id="editBanner" hidden>
        <span class="chip chip-accent">编辑中</span>
        <span class="edit-file" id="editFile"></span>
        <a class="edit-back" href="/manage">← 返回文章管理</a>
      </div>
      <input class="title-input" id="title" type="text" placeholder="文章标题…" autocomplete="off" spellcheck="false">
      <div class="meta-row">
        <div class="field">
          <label for="category">分类</label>
          <select id="category"><option value="">加载中…</option></select>
        </div>
        <div class="field">
          <label for="tags">标签（逗号分隔，留空会自动提取）</label>
          <input id="tags" type="text" placeholder="留空或不足 5 个，发布时自动补齐" autocomplete="off">
        </div>
      </div>
      <p class="edit-tip" id="editTip" hidden>改标题或分类只更新 frontmatter，文件位置不变，所以线上链接不会变。</p>
    </div>

    <div class="editor-toolbar">
      <button class="tool-btn" data-wrap="## " data-line="1" title="二级标题">H2</button>
      <button class="tool-btn" data-wrap="### " data-line="1" title="三级标题">H3</button>
      <span class="tool-sep"></span>
      <button class="tool-btn" data-wrap="**" title="加粗"><b>B</b></button>
      <button class="tool-btn" data-wrap="*" title="斜体"><i>I</i></button>
      <button class="tool-btn" data-wrap="`" title="行内代码">&lt;/&gt;</button>
      <span class="tool-sep"></span>
      <button class="tool-btn" id="tb-code" title="代码块">{ }</button>
      <button class="tool-btn" data-wrap="> " data-line="1" title="引用">❝</button>
      <button class="tool-btn" data-wrap="- " data-line="1" title="列表">≡</button>
      <span class="tool-sep"></span>
      <button class="tool-btn" id="tb-link" title="插入链接">链接</button>
      <button class="tool-btn" id="tb-image" title="插入图片">图片</button>
      <button class="tool-btn" id="tb-table" title="插入表格">表格</button>
    </div>

    <div class="editor-body">
      <textarea id="content" placeholder="在这里写正文，支持 Markdown。

## 小标题
正文段落…

- 列表项
- 列表项

```js
console.log('代码块')
```"></textarea>
    </div>

    <div class="pane-foot">
      <span id="wordcount">0 字</span>
      <span class="hint" id="saveState">草稿自动存在本机</span>
      <button class="btn btn-ghost btn-sm" id="btnDiscard" hidden>丢弃草稿</button>
      <span class="spacer"></span>
      <span class="hint" id="kbdHint" title="⌘/Ctrl + Enter 发布，⌘/Ctrl + S 保存草稿">⌘↵ 发布 · ⌘S 存草稿</span>
      <button class="btn btn-ghost" id="btnSaveDraft">保存草稿</button>
      <button class="btn btn-primary" id="btnPublish">发布</button>
    </div>
  </section>

  <aside class="pane preview">
    <div class="pane-head" style="flex-direction:row;align-items:center;gap:8px;padding:11px 16px;">
      <span class="card-title">预览</span>
      <span class="chip chip-accent">实时</span>
      <span class="hint" style="margin-left:auto;">排版近似线上效果</span>
    </div>
    <div class="preview-scroll">
      <div id="result"></div>
      <article class="article" id="preview">
        <div class="preview-empty">左侧写下标题和正文，这里会实时预览。</div>
      </article>
    </div>
  </aside>
</main>

<script src="/ui/ui.js"></script>
<script>
(function () {
  const { api, toast, renderMarkdown, countWords, esc, initTopbar } = window.WB;
  initTopbar();

  const $ = (id) => document.getElementById(id);
  const titleEl = $('title');
  const catEl = $('category');
  const tagsEl = $('tags');
  const contentEl = $('content');
  const previewEl = $('preview');
  const resultEl = $('result');
  const wordEl = $('wordcount');
  const saveStateEl = $('saveState');
  const discardBtn = $('btnDiscard');
  const publishBtn = $('btnPublish');
  const saveDraftBtn = $('btnSaveDraft');

  const DRAFT_KEY = 'wb.draft.v1';
  const NEW_CAT = '__new__';
  // 本篇在本机已保存过的文件路径（草稿或发布后记录），后续保存走「更新」而非重复新建
  let currentFile = '';

  // /publish?file=content/posts/xxx.md 进入编辑模式
  const EDIT_FILE = new URLSearchParams(location.search).get('file') || '';
  const editing = Boolean(EDIT_FILE);
  const editBanner = $('editBanner');
  const editFileEl = $('editFile');
  const kbdHint = $('kbdHint');
  let editDate = '';
  let isCurrentDraft = false;

  /* ---------- 分类 ---------- */

  async function loadCategories() {
    try {
      const data = await api('/api/categories');
      catEl.innerHTML = '';
      const cats = data.categories || [];
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = cats.length ? '选择分类…' : '（尚无分类）';
      catEl.appendChild(placeholder);
      for (const c of cats) {
        const o = document.createElement('option');
        o.value = c;
        o.textContent = c;
        catEl.appendChild(o);
      }
      const add = document.createElement('option');
      add.value = NEW_CAT;
      add.textContent = '＋ 新建分类…';
      catEl.appendChild(add);
      if (editing) return;
      const draft = readDraft();
      if (draft && draft.category && cats.includes(draft.category)) catEl.value = draft.category;
    } catch (e) {
      catEl.innerHTML = '<option value="">读取失败</option>';
    }
  }

  catEl.addEventListener('change', () => {
    if (catEl.value !== NEW_CAT) return;
    const name = (prompt('新分类名称（会成为 content/posts 下的目录名）') || '').trim();
    if (!name) {
      catEl.selectedIndex = 0;
      return;
    }
    const o = document.createElement('option');
    o.value = name;
    o.textContent = name;
    catEl.insertBefore(o, catEl.lastElementChild);
    catEl.value = name;
    updatePreview();
    saveDraftSoon();
  });

  /* ---------- 工具栏 ---------- */

  function surround(before, after) {
    const { selectionStart: s, selectionEnd: e, value } = contentEl;
    const sel = value.slice(s, e);
    contentEl.setRangeText(before + sel + after, s, e, 'end');
    if (!sel) contentEl.setSelectionRange(s + before.length, s + before.length);
    contentEl.focus();
    onInput();
  }

  function prefixLines(prefix) {
    const { selectionStart: s, selectionEnd: e, value } = contentEl;
    let start = value.lastIndexOf('\n', s - 1) + 1;
    let end = value.indexOf('\n', e);
    if (end === -1) end = value.length;
    const block = value.slice(start, end);
    const lines = block.split('\n').map((l) => (l.trim() ? prefix + l : l));
    const next = lines.join('\n');
    contentEl.setRangeText(next, start, end, 'end');
    contentEl.focus();
    onInput();
  }

  document.querySelectorAll('[data-wrap]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const wrap = btn.getAttribute('data-wrap');
      if (btn.hasAttribute('data-line')) prefixLines(wrap);
      else surround(wrap, wrap);
    });
  });

  $('tb-code').addEventListener('click', () => {
    const { selectionStart: s, selectionEnd: e, value } = contentEl;
    const sel = value.slice(s, e);
    const block = sel ? (sel.includes('\n') ? '```\n' + sel + '\n```' : '`' + sel + '`') : '```js\n\n```';
    contentEl.setRangeText(block, s, e, 'end');
    if (!sel) {
      const pos = s + 5;
      contentEl.setSelectionRange(pos, pos);
    }
    contentEl.focus();
    onInput();
  });

  $('tb-link').addEventListener('click', () => {
    const url = (prompt('链接地址', 'https://') || '').trim();
    if (!url) return;
    const { selectionStart: s, selectionEnd: e, value } = contentEl;
    const sel = value.slice(s, e);
    if (sel) {
      contentEl.setRangeText(`[${sel}](${url})`, s, e, 'end');
    } else {
      // 没选中就插入占位文字，并把它选中，直接打字即可替换
      const text = '链接文字';
      contentEl.setRangeText(`[${text}](${url})`, s, e, 'end');
      contentEl.setSelectionRange(s + 1, s + 1 + text.length);
    }
    contentEl.focus();
    onInput();
  });

  $('tb-image').addEventListener('click', () => {
    const url = prompt('图片地址（可先用图床拿到链接）', 'https://');
    if (!url) return;
    surround('![图片](' + url + ')', '');
  });

  $('tb-table').addEventListener('click', () => {
    surround('\n| 列 1 | 列 2 |\n| --- | --- |\n| 内容 | 内容 |\n\n', '');
  });

  contentEl.addEventListener('keydown', (e) => {
    if (e.key === 'Tab' && !e.shiftKey && !e.metaKey && !e.ctrlKey) {
      e.preventDefault();
      contentEl.setRangeText('  ', contentEl.selectionStart, contentEl.selectionEnd, 'end');
      onInput();
    }
  });

  /* ---------- 预览 ---------- */

  function updatePreview() {
    const title = titleEl.value.trim();
    const body = contentEl.value;
    const cat = catEl.value && catEl.value !== NEW_CAT ? catEl.value : '未分类';
    const today = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    // 编辑已有文章时预览显示原发布日期，而不是今天
    const date = editDate || `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;

    if (!title && !body.trim()) {
      previewEl.innerHTML = '<div class="preview-empty">左侧写下标题和正文，这里会实时预览。</div>';
      return;
    }

    const tags = (tagsEl.value || '')
      .split(/[,，]/)
      .map((t) => t.trim())
      .filter(Boolean);

    previewEl.innerHTML =
      `<h1 class="article-title">${esc(title || '（未命名）')}</h1>` +
      `<div class="article-meta"><span>${esc(date)}</span><span>${esc(cat)}</span>` +
      (tags.length ? `<span># ${esc(tags.join(' · '))}</span>` : '') +
      `</div>` +
      `<div class="article-body">${renderMarkdown(body) || '<p class="preview-empty">（正文为空）</p>'}</div>`;
  }

  function updateCount() {
    const { chars, words } = countWords(contentEl.value);
    wordEl.textContent = `${words} 字 · ${chars} 字符`;
  }

  /* ---------- 草稿 ---------- */

  let draftTimer = null;
  function saveDraft() {
    // 编辑已有文章不写草稿，免得和新文章的草稿互相覆盖
    if (editing) return;
    const data = {
      title: titleEl.value,
      category: catEl.value === NEW_CAT ? '' : catEl.value,
      tags: tagsEl.value,
      content: contentEl.value,
      ts: Date.now(),
      file: currentFile || undefined,
    };
    try {
      if (!data.title && !data.content.trim()) {
        localStorage.removeItem(DRAFT_KEY);
        saveStateEl.textContent = '草稿自动存在本机';
        discardBtn.hidden = true;
        return;
      }
      localStorage.setItem(DRAFT_KEY, JSON.stringify(data));
      const t = new Date(data.ts);
      saveStateEl.textContent = `草稿已保存 ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
      discardBtn.hidden = false;
    } catch (e) {
      saveStateEl.textContent = '草稿保存失败（本机存储不可用）';
    }
  }

  function saveDraftSoon() {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(saveDraft, 600);
  }

  function readDraft() {
    try {
      const raw = localStorage.getItem(DRAFT_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch {
      return null;
    }
  }

  function restoreDraft() {
    if (editing) return false;
    const d = readDraft();
    if (!d) return false;
    if (!d.title && !String(d.content || '').trim()) return false;
    titleEl.value = d.title || '';
    tagsEl.value = d.tags || '';
    contentEl.value = d.content || '';
    currentFile = d.file || '';
    discardBtn.hidden = false;
    saveStateEl.textContent = '已恢复上次未发布的草稿';
    return true;
  }

  discardBtn.addEventListener('click', () => {
    if (!confirm('丢弃本机草稿？正文会被清空。')) return;
    localStorage.removeItem(DRAFT_KEY);
    currentFile = '';
    titleEl.value = '';
    tagsEl.value = '';
    contentEl.value = '';
    discardBtn.hidden = true;
    saveStateEl.textContent = '草稿已清空';
    onInput();
  });

  /* ---------- 输入联动 ---------- */

  function onInput() {
    updatePreview();
    updateCount();
    saveDraftSoon();
  }

  [titleEl, tagsEl, contentEl].forEach((el) => el.addEventListener('input', onInput));
  catEl.addEventListener('change', onInput);

  /* ---------- 发布 ---------- */

  function renderResult(ok, payload, mode) {
    const deploy = payload.deploy || {};
    const isDraft = mode === 'draft';
    const log = deploy.output ? `<details><summary class="hint" style="cursor:pointer;margin-top:8px;">部署日志（${deploy.ms || 0} ms）</summary><pre>${esc(deploy.output)}</pre></details>` : '';
    if (ok) {
      let head;
      if (isDraft) head = '✅ 已保存为草稿';
      else if (editing) head = deploy.skipped ? '✅ 已保存修改' : '✅ 已保存并发布';
      else head = '✅ 已发布';
      const line3 = isDraft
        ? '（草稿已保存，不会发布上线）'
        : deploy.skipped ? '（仅写了本地文件，未推送）' : 'GitHub Actions 已触发，通常 30～60 秒后可访问';
      resultEl.innerHTML =
        `<div class="result ${isDraft ? 'draft' : 'ok'}">
          <div class="result-head">${head}</div>
          <div class="result-line">文件：${esc(payload.file || '')}</div>
          <div class="result-line">线上：<a href="${esc(payload.permalink || '#')}" target="_blank" rel="noopener">${esc(payload.permalink || '')}</a></div>
          <div class="result-line">${line3}</div>
          ${log}
        </div>`;
    } else {
      resultEl.innerHTML =
        `<div class="result err">
          <div class="result-head">❌ ${editing ? '没保存成功' : '没发出去'}</div>
          <div class="result-line">${esc(payload.error || '未知错误')}</div>
          ${payload.file ? `<div class="result-line">文件已生成：${esc(payload.file)}</div>` : ''}
          ${log}
        </div>`;
    }
    document.querySelector('.preview-scroll').scrollTo({ top: 0, behavior: 'smooth' });
  }

  function readTags() {
    return (tagsEl.value || '').split(/[,，]/).map((t) => t.trim()).filter(Boolean);
  }

  // 发布前补齐标签：够 5 个原样返回；不够就按标题/正文/分类让服务端算，并写回输入框
  async function fillTags(title, category, content) {
    const tags = readTags();
    if (tags.length >= 5) return tags;
    try {
      const data = await api('/api/suggest-tags', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content, category, existing: tags }),
      });
      const add = (data.tags || []).filter((t) => t && !tags.some((x) => x.toLowerCase() === t.toLowerCase()));
      if (!add.length) return tags;
      const next = tags.concat(add);
      tagsEl.value = next.join(', ');
      updatePreview();
      saveDraft();
      toast(tags.length ? `已补充 ${add.length} 个标签` : `已自动提取 ${add.length} 个标签`);
      return next;
    } catch (e) {
      // 补标签失败不该挡住发布，按原样提交
      return tags;
    }
  }

  let publishing = false;
  // mode = 'draft'（保存草稿：文件落盘，draft:true，不发布）或 'publish'（发布：draft:false 并部署）
  async function submit(mode) {
    const isDraft = mode === 'draft';
    if (publishing) return;
    const title = titleEl.value.trim();
    const category = catEl.value === NEW_CAT ? '' : catEl.value;
    const content = contentEl.value;

    if (!title) { toast('先写个标题吧', 'err'); titleEl.focus(); return; }
    if (!category) { toast('选一个分类', 'err'); catEl.focus(); return; }
    if (!content.trim()) { toast('正文还是空的', 'err'); contentEl.focus(); return; }

    // 编辑已发布文章时，若选「保存草稿」会把它从线上撤下，先确认一下
    if (isDraft && editing && !isCurrentDraft) {
      if (!confirm('这篇已是「已发布」状态，保存为草稿会让它从线上撤下。确定要转为草稿吗？')) return;
    }

    publishing = true;
    const activeBtn = isDraft ? saveDraftBtn : publishBtn;
    const original = activeBtn.textContent;
    publishBtn.disabled = true;
    saveDraftBtn.disabled = true;
    activeBtn.textContent = isDraft ? '存草稿中…' : (editing ? '保存中…' : '发布中…');
    saveDraft();
    const started = Date.now();

    try {
      // 标签不足 5 个时先补齐，用户能在标签框里看到补上了什么
      const tags = await fillTags(title, category, content);
      const body = { category, title, content, tags, draft: isDraft };
      let data;
      if (editing) {
        data = await api('/api/post', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.assign({ file: EDIT_FILE }, body)),
        });
      } else if (currentFile) {
        // 之前已在本机保存过（草稿或发布过）：更新同一篇，避免重复生成文件
        try {
          data = await api('/api/post', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.assign({ file: currentFile }, body)),
          });
        } catch (e) {
          // 文件可能已被删，退回「新建」
          if (/文件不存在|ENOENT|已被删除/.test(e.message || '')) {
            currentFile = '';
            data = await api('/api/publish', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
          } else throw e;
        }
      } else {
        data = await api('/api/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
      }
      currentFile = (data && data.file) || currentFile;
      isCurrentDraft = isDraft;
      renderResult(true, data, isDraft ? 'draft' : 'publish');
      toast(`${isDraft ? '草稿已保存到本机' : (editing ? '已保存' : '发布成功')} · ${Math.round((Date.now() - started) / 1000)}s`, isDraft ? 'draft' : 'ok');
      if (!editing) {
        if (isDraft) {
          // 草稿文件已落盘，但保留本机草稿（含文件路径），下次打开可继续编辑
          saveDraft();
          saveStateEl.textContent = '已保存为草稿（不会发布上线，可在「文章管理」里查看）';
        } else {
          localStorage.removeItem(DRAFT_KEY);
          discardBtn.hidden = true;
          saveStateEl.textContent = '已发布，草稿已清空';
        }
      } else {
        saveStateEl.textContent = isDraft ? '已保存为草稿（未发布）' : '已保存并发布';
      }
    } catch (e) {
      renderResult(false, Object.assign({ error: e.message }, e.payload || {}), isDraft ? 'draft' : 'publish');
      toast(`${isDraft ? '存草稿' : (editing ? '保存' : '发布')}失败：` + e.message, 'err', 4200);
      saveStateEl.textContent = editing ? '保存失败，改动还在编辑器里' : '保存失败，草稿仍保留';
    } finally {
      publishing = false;
      publishBtn.disabled = false;
      saveDraftBtn.disabled = false;
      activeBtn.textContent = original;
    }
  }

  // ⌘S 的语义：新文章存草稿；编辑时保持当前发布状态
  // （已发布的文章按 ⌘S 不该被误存成草稿而从线上撤下，想转草稿走「保存草稿」按钮）
  function shortcutMode() {
    if (!editing) return 'draft';
    return isCurrentDraft ? 'draft' : 'publish';
  }

  publishBtn.addEventListener('click', () => submit('publish'));
  saveDraftBtn.addEventListener('click', () => submit('draft'));

  document.addEventListener('keydown', (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key === 'Enter') {
      e.preventDefault();
      submit('publish');
    }
    if (mod && e.key.toLowerCase() === 's') {
      e.preventDefault();
      submit(shortcutMode());
    }
  });

  /* ---------- 编辑模式 ---------- */

  async function loadForEdit() {
    document.title = '编辑文章 · 写作台';
    editBanner.hidden = false;
    $('editTip').hidden = false;
    editFileEl.textContent = EDIT_FILE.replace(/^content\/posts\//, '');
    editFileEl.title = EDIT_FILE;
    publishBtn.textContent = '保存修改';
    kbdHint.textContent = '⌘↵ 保存并发布 · ⌘S 保存（保持当前发布状态）';
    kbdHint.title = '⌘/Ctrl + Enter 保存并发布；⌘/Ctrl + S 保存（已发布保持发布，草稿保持草稿）';
    saveStateEl.textContent = '读取中…';
    try {
      const data = await api('/api/post?file=' + encodeURIComponent(EDIT_FILE));
      const p = data.post || {};
      titleEl.value = p.title || '';
      contentEl.value = p.content || '';
      tagsEl.value = (p.tags || []).join(', ');
      isCurrentDraft = !!p.draft;
      // 文章分类可能是手写在 frontmatter 里的，不在目录列表里就补一个选项
      const cat = (p.categories || [])[0] || '';
      if (cat && ![...catEl.options].some((o) => o.value === cat)) {
        const o = document.createElement('option');
        o.value = cat;
        o.textContent = cat;
        catEl.insertBefore(o, catEl.lastElementChild);
      }
      catEl.value = cat;
      // 线上文章页显示到秒，预览跟着显示到秒（没有时间的旧文章自然只剩日期）
      editDate = (p.date || '').slice(0, 19).replace('T', ' ');
      saveStateEl.textContent = p.draft ? '这是一篇草稿' : '已载入，可修改后保存';
      onInput();
      (titleEl.value ? contentEl : titleEl).focus({ preventScroll: true });
      contentEl.scrollTop = 0;
    } catch (e) {
      toast('读取文章失败：' + e.message, 'err', 5000);
      saveStateEl.textContent = '读取失败，检查文件是否还在';
    }
  }

  /* ---------- 启动 ---------- */

  (async function boot() {
    await loadCategories();
    if (editing) {
      await loadForEdit();
      return;
    }
    const restored = restoreDraft();
    onInput();
    if (restored) toast('已恢复上次未发布的草稿');
    (titleEl.value ? contentEl : titleEl).focus();
  })();
})();
</script>
</body>
</html>
